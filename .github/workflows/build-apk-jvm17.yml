
name: Build Briefcase APK - JVM 17

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Briefcase source
        run: |
          test -f Briefcase-Updated-Security-Source.zip
          unzip -o Briefcase-Updated-Security-Source.zip -d extracted
          test -d extracted/MyDictionary/app

      - name: Configure JVM 17 for Java and Kotlin
        run: |
          cat > jvm17.init.gradle <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }

              tasks.configureEach { task ->
                  if (task.class.name.contains('KotlinCompile')) {
                      task.kotlinOptions.jvmTarget = '17'
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: |
          cd extracted/MyDictionary
          gradle --init-script ../../jvm17.init.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Briefcase-APK
          path: extracted/MyDictionary/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
