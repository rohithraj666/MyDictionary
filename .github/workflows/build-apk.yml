
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Briefcase source
        run: |
          unzip -o Briefcase-Updated-Security-Source.zip -d extracted

      - name: Build debug APK
        run: |
          cd extracted/MyDictionary
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Briefcase-APK
          path: extracted/MyDictionary/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
